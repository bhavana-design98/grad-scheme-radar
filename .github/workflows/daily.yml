name: Daily verify

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC every day (06:15 UK in summer, 05:15 in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/schemes.json"]

permissions:
  contents: write

concurrency:
  group: daily-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Re-check every employer page
        run: node scripts/verify.mjs
      - name: Pull in new listings from job APIs (only when keys are set)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: node scripts/discover.mjs
      - name: Commit the refreshed list
        run: |
          git config user.name "scheme-radar-bot"
          git config user.email "scheme-radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Daily refresh $(date -u +%Y-%m-%d)" && git push; fi
